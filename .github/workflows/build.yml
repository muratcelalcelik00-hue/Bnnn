name: Build Polyfield mod

on:
  push:
    branches: ['claude/**', 'main']
    paths-ignore: ['ci-out/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build (code only, no Polyfield assets)
        run: |
          set -o pipefail
          gradle build --no-daemon --continue 2>&1 | tee build.log
          echo "BUILD EXIT ${PIPESTATUS[0]}"

      - name: Compiler errors
        if: always()
        run: |
          grep -E "error:|warning: \[|FAILED|BUILD (SUCCESSFUL|FAILED)" -A3 build.log | head -150 || true

      - name: Dedicated server self-test
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          timeout 1200 gradle runServer -Pselftest --no-daemon > server.log 2>&1 || true
          grep -E "POLYFIELD|ERROR|Exception|Caused by|at com.bnnn" server.log | head -80 || true
          grep -q "POLYFIELD SELFTEST PASS" server.log

      - name: Production server self-test (the shipped jar on a real Fabric server)
        if: always()
        run: |
          mkdir -p prod/mods && cd prod
          curl -sSfL -o server.jar "https://meta.fabricmc.net/v2/versions/loader/1.20.1/0.16.10/1.0.1/server/jar"
          curl -sSfL -o mods/fabric-api.jar "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/0.92.2+1.20.1/fabric-api-0.92.2+1.20.1.jar"
          cp ../build/libs/polyfield-1.0.0.jar mods/
          echo "eula=true" > eula.txt
          timeout 900 java -Dpolyfield.selftest=true -Xmx2G -jar server.jar nogui > ../prod-server.log 2>&1 || true
          cd ..
          grep -E "POLYFIELD|ERROR|Exception|Caused by" prod-server.log | head -60 || true
          grep -q "POLYFIELD SELFTEST PASS" prod-server.log

      - name: Client self-test (xvfb, software OpenGL)
        if: always()
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          mkdir -p run/saves && rm -rf run/saves/pftest && cp -r run/world run/saves/pftest || true
          timeout 1500 xvfb-run -a -s "-screen 0 1280x720x24" gradle runClient -Pselftest --no-daemon > client.log 2>&1 || true
          grep -E "POLYFIELD|ERROR|Exception|Caused by|at com.bnnn|Mixin|mixin" client.log | head -120 || true
          grep -q "POLYFIELD CLIENT SELFTEST PASS" client.log

      - name: Publish results to the branch (ci-out/)
        if: always()
        run: |
          mkdir -p ci-out
          cp build/libs/polyfield-*.jar ci-out/ 2>/dev/null || true
          rm -f ci-out/*-sources.jar
          cp build.log server.log client.log prod-server.log ci-out/ 2>/dev/null || true
          cp run/screenshots/*.png ci-out/ 2>/dev/null || true
          cp -r run/crash-reports ci-out/ 2>/dev/null || true
          git config user.name "polyfield-ci"
          git config user.email "polyfield-ci@users.noreply.github.com"
          git add -f ci-out
          git commit -m "CI output for ${GITHUB_SHA::7} [skip ci]" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME} || (git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME})
